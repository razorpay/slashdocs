name: Release

# Publishes a release when a maintainer pushes a semver tag (v1.2.3 or a
# pre-release such as v1.2.3-rc.1). Tag creation is restricted to maintainers
# by a repository ruleset; see docs/releasing.md.
#
# Produces:
#   - Docker Hub image razorpay/slashdocs:<version>, :<major>.<minor>, and
#     :latest (latest is skipped for pre-releases), for linux/amd64 and arm64.
#     The image serves CLI binaries signed with the
#     SLASHDOCS_CLI_SIGNING_PRIVATE_KEY secret. All CLI builds trust the
#     SLASHDOCS_CLI_SIGNING_PUBLIC_KEY variable.
#   - A GitHub Release with CLI archives, checksums, the packaged Helm chart,
#     and a changelog generated from the commits since the previous tag.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Docker image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    env:
      SLASHDOCS_CLI_SIGNING_PRIVATE_KEY: ${{ secrets.SLASHDOCS_CLI_SIGNING_PRIVATE_KEY }}
      SLASHDOCS_CLI_SIGNING_PUBLIC_KEY: ${{ vars.SLASHDOCS_CLI_SIGNING_PUBLIC_KEY }}
    steps:
      # Without the keys, the image serves unsigned CLI binaries or builds
      # CLIs that install no updates.
      - name: Require the CLI signing keys
        run: |
          test -n "$SLASHDOCS_CLI_SIGNING_PRIVATE_KEY" || { echo "::error::The SLASHDOCS_CLI_SIGNING_PRIVATE_KEY secret is not set; see docs/releasing.md"; exit 1; }
          test -n "$SLASHDOCS_CLI_SIGNING_PUBLIC_KEY" || { echo "::error::The SLASHDOCS_CLI_SIGNING_PUBLIC_KEY variable is not set; see docs/releasing.md"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.PUBLIC_DOCKER_USERNAME }}
          password: ${{ secrets.PUBLIC_DOCKER_PASSWORD }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: razorpay/slashdocs
          # `latest=auto` only tags :latest for a non-pre-release semver tag.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=slashdocs
            org.opencontainers.image.description=Give your agents the power to publish reviewable HTML documents.
            org.opencontainers.image.vendor=Razorpay
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SLASHDOCS_VERSION=${{ github.ref_name }}
            SLASHDOCS_COMMIT_SHA=${{ github.sha }}
            SLASHDOCS_CLI_SIGNING_PUBLIC_KEY=${{ vars.SLASHDOCS_CLI_SIGNING_PUBLIC_KEY }}
          secret-envs: |
            SLASHDOCS_CLI_SIGNING_PRIVATE_KEY=SLASHDOCS_CLI_SIGNING_PRIVATE_KEY
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    # Never publish release notes that point at an image that failed to push.
    needs: image
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The CLI embeds the `slashdocs local` app, which the frontend build makes.
      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # The chart's version and appVersion follow the git tag, so the packaged
      # chart always points at the image this run just pushed.
      - name: Package Helm chart
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist-chart
          helm lint charts/slashdocs
          helm package charts/slashdocs \
            --version "$version" \
            --app-version "$version" \
            --destination dist-chart
          ls -l dist-chart

      - name: Build CLI archives and publish the release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLASHDOCS_CLI_SIGNING_PUBLIC_KEY: ${{ vars.SLASHDOCS_CLI_SIGNING_PUBLIC_KEY }}
