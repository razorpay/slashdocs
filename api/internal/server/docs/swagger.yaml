  /v1/documents/{id}/source-edits:
    post:
      consumes:
      - application/json
      description: 'For the browser editor. Applies replacements by position in the
        HTML of base_version_id to the current version, and saves the result as a
        new version. start and end count UTF-8 bytes, end is exclusive, and old_html
        must be the HTML from start to end of the base version. Replacements are in
        order and do not overlap. When a newer version exists, the replacements merge
        with its changes and the response has rebased set: text that both insert at
        one point stays twice, and text that either deletes goes. A retry with the
        same client_change_id returns the version that the first attempt made.'
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Replacements
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/server.editSourceRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.editSourceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.errorEnvelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.errorEnvelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.errorEnvelope'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/server.errorEnvelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/server.errorEnvelope'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Edit document source by position
      tags:
      - versions
  /v1/documents/{id}/versions:
    get:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.listResponse-repo_Version'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: List versions
      tags:
      - versions
    post:
      consumes:
      - multipart/form-data
      description: Saves the uploaded HTML as a new version. When base_version_id
        is an earlier version of the document, the changes from that version to the
        upload move onto the current version, and the response has rebased set. When
        the current version changed the same HTML, the response is version_conflict.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Base version ID
        in: formData
        name: base_version_id
        required: true
        type: string
      - description: Change summary
        in: formData
        name: change_summary
        type: string
      - description: HTML file
        in: formData
        name: file
        required: true
        type: file
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.createVersionResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/server.errorEnvelope'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/server.errorEnvelope'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Create version
      tags:
      - versions
  /v1/documents/{id}/versions/{version_id}:
    get:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Version ID
        in: path
        name: version_id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/repo.Version'
      security:
