  /v1/documents/{id}/approvals:
    get:
      description: Per-approver decisions on the content of a version (current version
        by default), merged with pending approvers, plus the derived aggregate status.
        A decision made on an earlier version with the same content counts, and names
        that version.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Version ID (defaults to the current version)
        in: query
        name: version
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.approvalsListResponse'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: List decisions and aggregate status
      tags:
      - approvals
    post:
      description: Records the caller's decision on the content of a version. The
        decision vouches for that content, so every version with the same content
        shows it. Submitting again replaces the previous decision on that content.
        A rejection needs a note unless the caller has open comment threads on the
        document (the comments say what to change). Returns 409 when the document's
        content changed since that version.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.approvalResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.approvalResponse'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Submit or update a decision
      tags:
      - approvals
  /v1/documents/{id}/approvals/{approval_id}:
    delete:
      description: Removes the caller's decision, returning them to pending. Assignment
        is unaffected.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Approval ID
        in: path
        name: approval_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Revoke own decision
      tags:
      - approvals
  /v1/documents/{id}/approvers:
