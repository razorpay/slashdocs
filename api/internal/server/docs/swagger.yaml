  /v1/documents/{id}/comments/{comment_id}/reactions/{emoji}:
    delete:
      description: Removes the caller's reaction from a comment or reply. Removing
        an absent reaction is a no-op.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Comment ID
        in: path
        name: comment_id
        required: true
        type: string
      - description: Reaction slug
        enum:
        - "+1"
        - "-1"
        - laugh
        - hooray
        - confused
        - heart
        - rocket
        - eyes
        - plus
        in: path
        name: emoji
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Remove comment reaction
      tags:
      - comments
    put:
      description: Adds the caller's reaction to a comment or reply. Repeating the
        same reaction is a no-op.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Comment ID
        in: path
        name: comment_id
        required: true
