        - "-1"
        - laugh
        - hooray
        - confused
        - heart
        - rocket
        - eyes
        - plus
        in: path
        name: emoji
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Add comment reaction
      tags:
      - comments
