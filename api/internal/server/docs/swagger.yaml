basePath: /
definitions:
  auth.Principal:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      picture_url:
        type: string
      type:
        $ref: '#/definitions/auth.PrincipalType'
    type: object
  auth.PrincipalType:
    enum:
    - user
    - service_account
    - google_group
    - anyone
    - anonymous
    type: string
    x-enum-varnames:
    - PrincipalUser
    - PrincipalServiceAccount
    - PrincipalGoogleGroup
    - PrincipalAnyone
    - PrincipalAnonymous
  repo.AccessRequest:
    properties:
      requested_at:
        type: string
      requester:
        $ref: '#/definitions/auth.Principal'
    type: object
  repo.Anchor:
    properties:
      dom_path:
        type: string
      end_offset:
        type: integer
      point:
        allOf:
        - $ref: '#/definitions/repo.AnchorPoint'
        description: |-
          Point pins the comment to a spot in an element instead of to the quoted
          text. The text fields then hold the start of the element's own text,
          which finds the element again after the document changes.
      prefix:
        type: string
      quote:
        type: string
      start_offset:
        type: integer
      suffix:
        type: string
    type: object
  repo.AnchorPoint:
    properties:
      label:
        type: string
      page_x:
        type: number
      page_y:
        type: number
      path:
        type: string
      target:
        type: string
      viewport_w:
        type: number
      x:
        type: number
      "y":
        type: number
    type: object
  repo.ApprovalSummary:
    properties:
      approved:
        type: integer
      pending:
        type: integer
      rejected:
        type: integer
      total:
        type: integer
    type: object
  repo.CLICredential:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  repo.Document:
    properties:
      approval_status:
        description: |-
          ApprovalStatus and ApprovalSummary are handler-populated (like
          ParentFolder) and only present when the document has assigned approvers.
        type: string
      approval_summary:
        $ref: '#/definitions/repo.ApprovalSummary'
      can_move:
        description: 'CanMove is set by GET /v1/documents/{id}: the caller may move
          it.'
        type: boolean
      current_version_id:
        type: string
      id:
        type: string
      labels:
        items:
          type: string
        type: array
      owner:
        $ref: '#/definitions/auth.Principal'
      parent_folder:
        $ref: '#/definitions/repo.FolderBreadcrumb'
      parent_folder_id:
        type: string
      snippet:
        description: |-
          Snippet is set in search results when the text matches. U+0002 and
          U+0003 surround each match.
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  repo.DocumentAccessRequest:
    properties:
      document_id:
        type: string
      document_title:
        type: string
      requested_at:
        type: string
      requester:
        $ref: '#/definitions/auth.Principal'
    type: object
  repo.FolderBreadcrumb:
    properties:
      id:
        type: string
      title:
        type: string
    type: object
  repo.Grant:
    properties:
      document_id:
        type: string
      granted_by:
        $ref: '#/definitions/auth.Principal'
      id:
        type: string
      principal:
        $ref: '#/definitions/auth.Principal'
      resource_id:
        type: string
      resource_type:
        type: string
      role:
        $ref: '#/definitions/repo.Role'
    type: object
  repo.InboxItem:
    properties:
      at:
        type: string
      body:
        type: string
      comment_id:
        type: string
      document_id:
        type: string
      document_title:
        type: string
      from:
        allOf:
        - $ref: '#/definitions/auth.Principal'
        description: From asked for the approval, or wrote the newest unread message,
          Body.
      kind:
        description: |-
          Kind is "approval" for a document to approve, or "thread" for a thread
          with a message to read.
        type: string
    type: object
  repo.NotificationPreferences:
    properties:
      effective_enabled:
        type: boolean
      enabled:
        type: boolean
    type: object
  repo.OwnershipTransfer:
    properties:
      from_user_id:
        type: string
      id:
        type: string
      service_account_id:
        type: string
      status:
        type: string
      to_user_id:
        type: string
    type: object
  repo.Role:
    enum:
    - ""
    - viewer
    - commenter
    - editor
    - owner
    type: string
    x-enum-varnames:
    - RoleNone
    - RoleViewer
    - RoleCommenter
    - RoleEditor
    - RoleOwner
  repo.ServiceAccount:
    properties:
      disabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/auth.Principal'
    type: object
  repo.ServiceAccountKey:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  repo.Version:
    properties:
      change_summary:
        type: string
      created_at:
        type: string
      created_by:
        $ref: '#/definitions/auth.Principal'
      document_id:
        type: string
      id:
        type: string
      live:
        description: Live is set when the browser editor made the version.
        type: boolean
      number:
        type: integer
      sha256:
        type: string
    type: object
  server.approvalListItem:
    properties:
      approver:
        $ref: '#/definitions/server.principalResponse'
      comments_open:
        description: |-
          CommentsOpen and CommentsTotal count the comment threads this approver
          started on the document, so a rejection can say "2 open of 3".
        type: integer
      comments_total:
        type: integer
      decided_at:
        type: string
      decision:
        type: string
      earlier:
        allOf:
        - $ref: '#/definitions/server.earlierDecision'
        description: |-
          Earlier is set while the approver is pending on this content: their most
          recent decision, made on other content of the document. On the current
          version it lets the UI say "Approved before the latest edits".
      id:
        type: string
      note:
        type: string
      version_id:
        description: |-
          VersionID and VersionNumber name the version the approver decided on.
          It can be older than the listed version when the content is the same,
          so the UI can say "Approved on v3".
        type: string
      version_number:
        type: integer
    type: object
  server.approvalRequestResponse:
    properties:
      approver:
        $ref: '#/definitions/server.principalResponse'
      document_id:
        type: string
      id:
        type: string
      requested_by:
        $ref: '#/definitions/server.requestedByJSON'
    type: object
  server.approvalResponse:
    properties:
      approver:
        $ref: '#/definitions/server.principalResponse'
      decided_at:
        type: string
      decision:
        type: string
      document_id:
        type: string
      id:
        type: string
      note:
        type: string
      version_id:
        type: string
      version_number:
        type: integer
      version_sha256:
        type: string
    type: object
  server.approvalsListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/server.approvalListItem'
        type: array
      status:
        type: string
      summary:
        $ref: '#/definitions/repo.ApprovalSummary'
      version_id:
        type: string
      version_number:
        type: integer
      version_sha256:
        type: string
    type: object
  server.cliExchangePrincipal:
    properties:
      email:
        type: string
      id:
        type: string
      type:
        type: string
    type: object
  server.cliExchangeResponse:
    properties:
      id:
        type: string
      principal:
        $ref: '#/definitions/server.cliExchangePrincipal'
      token:
        type: string
    type: object
  server.commentMentionPrincipalRef:
    properties:
      id:
        type: string
      type:
        $ref: '#/definitions/server.commentMentionPrincipalType'
    type: object
  server.commentMentionPrincipalResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      picture_url:
        type: string
      type:
        $ref: '#/definitions/server.commentMentionPrincipalType'
    type: object
  server.commentMentionPrincipalType:
    enum:
    - user
    - service_account
    type: string
    x-enum-varnames:
    - commentMentionPrincipalUser
    - commentMentionPrincipalServiceAccount
  server.commentMentionRequest:
    properties:
      length:
        description: Length is the range length in UTF-16 code units.
        type: integer
      offset:
        description: Offset is the zero-based start in UTF-16 code units.
        type: integer
      principal:
        $ref: '#/definitions/server.commentMentionPrincipalRef'
    type: object
  server.commentMentionResponse:
    properties:
      length:
        description: Length is the range length in UTF-16 code units.
        type: integer
      offset:
        description: Offset is the zero-based start in UTF-16 code units.
        type: integer
      principal:
        $ref: '#/definitions/server.commentMentionPrincipalResponse'
    type: object
  server.commentPlacementResponse:
    properties:
      anchor:
        $ref: '#/definitions/repo.Anchor'
      confidence:
        type: number
      matched_text:
        type: string
      status:
        enum:
        - attached
        - orphaned
        - moved
        type: string
      version_id:
        type: string
    type: object
  server.commentReactionResponse:
    properties:
      count:
        type: integer
      emoji:
        type: string
      reacted:
        type: boolean
      reactors:
        items:
          $ref: '#/definitions/server.principalResponse'
        type: array
    type: object
  server.commentResponse:
    properties:
      anchor:
        $ref: '#/definitions/repo.Anchor'
      author:
        $ref: '#/definitions/server.principalResponse'
      body:
        type: string
      created_at:
        type: string
      created_on_version_id:
        type: string
      current_placement:
        $ref: '#/definitions/server.commentPlacementResponse'
      edited:
        type: boolean
      id:
        type: string
      mentions:
        items:
          $ref: '#/definitions/server.commentMentionResponse'
        type: array
      parent_comment_id:
        type: string
      reactions:
        items:
          $ref: '#/definitions/server.commentReactionResponse'
        type: array
      replies:
        items:
          $ref: '#/definitions/server.commentResponse'
        type: array
      resolved_at:
        type: string
      selected_text:
        type: string
      status:
        type: string
      unread:
        description: |-
          Unread is set on a thread with a message by someone else that the
          signed-in reader did not read. Anonymous readers get no read state.
        type: boolean
    type: object
  server.configResponse:
    properties:
      default_doc_permission:
        type: string
      deployment:
        type: string
      everyone_label:
        type: string
      google_groups_enabled:
        type: boolean
      labels_enabled:
        type: boolean
      org_name:
        type: string
      provider_name:
        type: string
    type: object
  server.createCommentReplyRequest:
    properties:
      body:
        type: string
      mentions:
        items:
          $ref: '#/definitions/server.commentMentionRequest'
        type: array
    type: object
  server.createCommentRequest:
    properties:
      anchor:
        $ref: '#/definitions/repo.Anchor'
      body:
        type: string
      mentions:
        items:
          $ref: '#/definitions/server.commentMentionRequest'
        type: array
      version_id:
        type: string
    type: object
  server.createDocumentResponse:
    properties:
      current_version_id:
        type: string
      default_grant:
        $ref: '#/definitions/server.defaultGrant'
      folder_id:
        type: string
      id:
        type: string
      permission_warning:
        $ref: '#/definitions/server.permissionWarning'
    type: object
  server.createGrantResponse:
    properties:
      granted_by:
        $ref: '#/definitions/server.grantGrantedBy'
      id:
        type: string
      principal:
        $ref: '#/definitions/server.grantPrincipal'
      resource:
        $ref: '#/definitions/server.grantResource'
      role:
        $ref: '#/definitions/repo.Role'
    type: object
  server.createServiceAccountResponse:
    properties:
      disabled:
        type: boolean
      grants:
        items: {}
        type: array
      id:
        type: string
      key:
        $ref: '#/definitions/server.serviceAccountKey'
      label:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/server.serviceAccountOwner'
    type: object
  server.createVersionResponse:
    properties:
      base_version_id:
        description: BaseVersionID is the version that the new version saved on.
        type: string
      change_summary:
        type: string
      id:
        type: string
      number:
        type: integer
      rebased:
        description: |-
          Rebased is set when that version is newer than the base version of the
          upload, so the new version also holds the changes of other writers.
        type: boolean
      sha256:
        type: string
    type: object
  server.defaultGrant:
    properties:
      grant_id:
        type: string
      principal:
        $ref: '#/definitions/server.defaultGrantPrincipal'
      role:
        $ref: '#/definitions/repo.Role'
    type: object
  server.defaultGrantPrincipal:
    properties:
      type:
        $ref: '#/definitions/auth.PrincipalType'
    type: object
  server.discoveryAuth:
    properties:
      modes:
        items:
          type: string
        type: array
    type: object
  server.discoveryResponse:
    properties:
      api_version:
        type: string
      auth:
        $ref: '#/definitions/server.discoveryAuth'
      name:
        type: string
    type: object
  server.documentChangesResponse:
    properties:
      authors:
        description: |-
          Authors made the versions after from. The author of the newest version
          comes first.
        items:
          $ref: '#/definitions/auth.Principal'
        type: array
      from_version_id:
        type: string
      live:
        description: Live is set when the browser editor made every version after
          from.
        type: boolean
      replacements:
        description: |-
          Replacements turn the HTML of the version from into the HTML of the
          current version. They are in order, at byte offsets of the version from.
        items:
          $ref: '#/definitions/textedit.Replacement'
        type: array
      version_id:
        description: VersionID is the current version.
        type: string
    type: object
  server.documentLinkResponse:
    properties:
      url:
        type: string
    type: object
  server.documentListResponse:
    properties:
      has_more:
        description: HasMore reports that more documents follow this page.
        type: boolean
      items:
        items:
          $ref: '#/definitions/repo.Document'
        type: array
    type: object
  server.earlierDecision:
    properties:
      decided_at:
        type: string
      decision:
        type: string
    type: object
  server.editDocumentRequest:
    properties:
      base_version_id:
        description: |-
          BaseVersionID, when set, must be the current version. When it is
          empty the edits apply to whatever version is current, which is safe
          because each edit must still find its text there.
        type: string
      change_summary:
        type: string
      edits:
        items:
          $ref: '#/definitions/textedit.Edit'
        type: array
    type: object
  server.editDocumentResponse:
    properties:
      base_version_id:
        description: BaseVersionID is the version the edits were applied to.
        type: string
      change_summary:
        type: string
      edits_applied:
        type: integer
      id:
        type: string
      number:
        type: integer
      sha256:
        type: string
    type: object
  server.editSourceRequest:
    properties:
      base_version_id:
        description: BaseVersionID is the version that the replacements were made
          on.
        type: string
      change_summary:
        description: |-
          ChangeSummary, when set, is what History shows for the change. When it
          is empty, the server names what a reader sees change.
        type: string
      client_change_id:
        description: |-
          ClientChangeID names the change, so that a retry returns the version
          that the change made instead of a second one.
        type: string
      replacements:
        items:
          $ref: '#/definitions/textedit.Replacement'
        type: array
    type: object
  server.editSourceResponse:
    properties:
      base_version_id:
        description: BaseVersionID is the version the replacements were applied to.
        type: string
      change_summary:
        type: string
      id:
        type: string
      number:
        type: integer
      others:
        description: |-
          Others, set when rebased, turn the HTML that the caller holds, the
          base version with its replacements, into the HTML of the new version:
          the changes of the other writers. They are in order, at byte offsets
          of the HTML that the caller holds.
        items:
          $ref: '#/definitions/textedit.Replacement'
        type: array
      rebased:
        description: |-
          Rebased is set when that version is newer than the version that the
          replacements were made on.
        type: boolean
      sha256:
        type: string
    type: object
  server.errorBody:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  server.errorEnvelope:
    properties:
      error:
        $ref: '#/definitions/server.errorBody'
    type: object
  server.googleGroupSearchItem:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  server.googleGroupSearchResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/server.googleGroupSearchItem'
        type: array
    type: object
  server.grantGrantedBy:
    properties:
      email:
        type: string
      id:
        type: string
    type: object
  server.grantInput:
    properties:
      address:
        type: string
      principal:
        $ref: '#/definitions/server.grantPrincipalInput'
      role:
        allOf:
        - $ref: '#/definitions/repo.Role'
        enum:
        - viewer
        - commenter
        - editor
    type: object
  server.grantPrincipal:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      type:
        $ref: '#/definitions/auth.PrincipalType'
    type: object
  server.grantPrincipalInput:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      type:
        allOf:
        - $ref: '#/definitions/auth.PrincipalType'
        enum:
        - user
        - service_account
        - google_group
        - anyone
    type: object
  server.grantResource:
    properties:
      id:
        type: string
      type:
        type: string
    type: object
  server.headingResponse:
    properties:
      id:
        type: string
      level:
        type: integer
      text:
        type: string
      url:
        type: string
    type: object
  server.listResponse-repo_AccessRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/repo.AccessRequest'
        type: array
    type: object
  server.listResponse-repo_CLICredential:
    properties:
      items:
        items:
          $ref: '#/definitions/repo.CLICredential'
        type: array
    type: object
  server.listResponse-repo_DocumentAccessRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/repo.DocumentAccessRequest'
        type: array
    type: object
  server.listResponse-repo_InboxItem:
    properties:
      items:
        items:
          $ref: '#/definitions/repo.InboxItem'
        type: array
    type: object
  server.listResponse-repo_OwnershipTransfer:
    properties:
      items:
        items:
          $ref: '#/definitions/repo.OwnershipTransfer'
        type: array
    type: object
  server.listResponse-repo_ServiceAccount:
    properties:
      items:
        items:
          $ref: '#/definitions/repo.ServiceAccount'
        type: array
    type: object
  server.listResponse-repo_ServiceAccountKey:
    properties:
      items:
        items:
          $ref: '#/definitions/repo.ServiceAccountKey'
        type: array
    type: object
  server.listResponse-repo_Version:
    properties:
      items:
        items:
          $ref: '#/definitions/repo.Version'
        type: array
    type: object
  server.listResponse-server_approvalRequestResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/server.approvalRequestResponse'
        type: array
    type: object
  server.listResponse-server_commentResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/server.commentResponse'
        type: array
    type: object
  server.listResponse-server_headingResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/server.headingResponse'
        type: array
    type: object
  server.meResponse:
    properties:
      principal:
        $ref: '#/definitions/server.principalRef'
      service_account:
        $ref: '#/definitions/server.meServiceAccount'
      user:
        $ref: '#/definitions/server.userResponse'
    type: object
  server.meServiceAccount:
    properties:
      disabled:
        type: boolean
      id:
        type: string
      name:
        type: string
      owner:
        $ref: '#/definitions/server.meServiceOwner'
    type: object
  server.meServiceOwner:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  server.notificationPreferencesRequest:
    properties:
      enabled:
        type: boolean
    type: object
  server.patchCommentRequest:
    properties:
      anchor:
        allOf:
        - $ref: '#/definitions/repo.Anchor'
        description: Anchor moves a point comment to a new spot.
      base_body:
        description: |-
          BaseBody is the body that an edit started from. When set, and another
          edit changed the body since, the patch fails with 409 comment_changed.
        type: string
      body:
        type: string
      mentions:
        items:
          $ref: '#/definitions/server.commentMentionRequest'
        type: array
      status:
        type: string
    type: object
  server.permissionWarning:
    properties:
      kind:
        type: string
      message:
        type: string
    type: object
  server.principalRef:
    properties:
      id:
        type: string
      type:
        $ref: '#/definitions/auth.PrincipalType'
    type: object
  server.principalResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      picture_url:
        type: string
      type:
        $ref: '#/definitions/auth.PrincipalType'
    type: object
  server.renderTokenResponse:
    properties:
      token:
        type: string
      url:
        type: string
    type: object
  server.requestedByJSON:
    properties:
      email:
        type: string
      id:
        type: string
    type: object
  server.restoreVersionRequest:
    properties:
      change_summary:
        type: string
    type: object
  server.serviceAccountKey:
    properties:
      id:
        type: string
      token:
        type: string
    type: object
  server.serviceAccountOwner:
    properties:
      email:
        type: string
      id:
        type: string
    type: object
  server.userResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      picture_url:
        type: string
    type: object
  textedit.Edit:
    properties:
      new_string:
        type: string
      old_string:
        type: string
      replace_all:
        type: boolean
    type: object
  textedit.Replacement:
    properties:
      end:
        type: integer
      new_html:
        type: string
      old_html:
        type: string
      start:
        type: integer
    type: object
info:
  contact: {}
  description: This API powers slashdocs, a collaborative workspace where agents and
    people publish self-contained HTML documents, comment on specific text ranges
    inside them, and publish new versions.
  title: slashdocs API
  version: v1
paths:
  /.well-known/slashdocs.json:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.discoveryResponse'
      summary: Deployment discovery
      tags:
      - discovery
  /commit.txt:
    get:
      produces:
