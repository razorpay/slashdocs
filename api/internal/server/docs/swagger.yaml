  /v1/documents/{id}/changes:
    get:
      description: For the browser, which follows the document while other people
        edit it. Gives the replacements that turn the HTML of the version from into
        the HTML of the current version. start and end count UTF-8 bytes of the version
        from, and end is exclusive. live is true when the browser editor made every
        version after from. authors made those versions, and the author of the newest
        comes first. When from is the current version, replacements and authors are
        empty.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Version ID that the caller has
        in: query
        name: from
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.documentChangesResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/server.errorEnvelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/server.errorEnvelope'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Get the changes since a version
      tags:
      - versions
  /v1/documents/{id}/comments:
    get:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: 'Thread status: open or resolved. Empty or all lists every thread.
          Replies travel with their thread.'
        in: query
        name: status
        type: string
      - description: Version ID
        in: query
        name: version_id
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.listResponse-server_commentResponse'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: List comments
      tags:
      - comments
    post:
      consumes:
      - application/json
      - application/vnd.slashdocs.comment-mentions+json
      description: |-
        Requests with non-empty mentions must use Content-Type application/vnd.slashdocs.comment-mentions+json so mixed-version deployments fail closed instead of dropping metadata.
        The anchor is a text anchor with a non-empty quote, or a point: anchor.point names an element by target (its data-slashdocs-target value or id), path (its child-index path under the body), or both, and x and y are fractions of its box, from 0 to 1 inside it and from -1000 to 1000 in all. A point may also give page_x and page_y, the spot in CSS pixels from the top left of the page, with viewport_w, the viewport width: they place the pin when a later version no longer has the element, and they alone put a point on the body. The text fields of a point hold the start of the element's text, which finds the element again after the document changes.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Comment body, anchor, and structured mentions
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/server.createCommentRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.commentResponse'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Create comment
      tags:
      - comments
  /v1/documents/{id}/comments/{comment_id}:
    delete:
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Comment ID
        in: path
        name: comment_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Delete comment
      tags:
      - comments
    patch:
      consumes:
      - application/json
      - application/vnd.slashdocs.comment-mentions+json
      description: Any request containing the mentions key, including an empty array,
        must use Content-Type application/vnd.slashdocs.comment-mentions+json so mixed-version
        deployments fail closed. An anchor with a point moves a point comment to a
        new spot. Text comments cannot move.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Comment ID
        in: path
        name: comment_id
        required: true
        type: string
      - description: Fields to update; omitted mentions are preserved unless the body
          changes
        in: body
        name: update
        required: true
        schema:
          $ref: '#/definitions/server.patchCommentRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.commentResponse'
        "409":
          description: 'comment_changed: the body is no longer base_body'
          schema:
            $ref: '#/definitions/server.errorEnvelope'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Update comment
      tags:
      - comments
