      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: List assigned approvers
      tags:
      - approvals
    post:
      description: Assigns a user or service account as an approver. The approver
        must already have at least viewer access on the document. An approver who
        loses viewer access when a grant is revoked stops being an approver.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.approvalRequestResponse'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Assign an approver
