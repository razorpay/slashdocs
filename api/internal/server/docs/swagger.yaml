  /v1/documents/{id}/access-requests:
    get:
      description: The newest first. People who manage access see every request. Other
        callers see only their own request, so that they know it waits. A grant on
        the document to the requester removes the request.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.listResponse-repo_AccessRequest'
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: List requests for access to a document
      tags:
      - documents
    post:
      description: Records the request for the people who manage access, and notifies
        the current owner when notifications are enabled. The response does not reveal
        whether the document or owner exists. Repeated requests are coalesced.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "202":
          description: Accepted
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - bearerAuth: []
      - cookieAuth: []
      summary: Request access to a document
      tags:
      - documents
  /v1/documents/{id}/access-requests/{requester_type}/{requester_id}:
    delete:
      description: Removes the request without a grant. The requester can ask again.
      parameters:
      - description: Document ID
        in: path
        name: id
        required: true
        type: string
      - description: Requester type
        enum:
        - user
        - service_account
        in: path
        name: requester_type
        required: true
        type: string
      - description: Requester ID
        in: path
        name: requester_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      security:
      - bearerAuth: []
      - cookieAuth: []
