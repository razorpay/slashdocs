{{- if and .Values.googleGroups.enabled (ne .Values.deployment.mode "org") }}
{{- fail "googleGroups.enabled requires deployment.mode=org" }}
{{- end }}
{{- if and .Values.googleGroups.enabled (not .Values.googleGroups.existingSecret) }}
{{- fail "googleGroups.existingSecret is required when googleGroups.enabled=true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "slashdocs.fullname" . }}
  labels:
    {{- include "slashdocs.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.updateStrategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "slashdocs.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "slashdocs.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "slashdocs.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: slashdocs
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          env:
            - name: SLASHDOCS_PORT
              value: {{ .Values.containerPort | quote }}
            - name: SLASHDOCS_METRICS_PORT
              value: {{ .Values.metrics.port | quote }}
            - name: SLASHDOCS_APP_ORIGIN
              value: {{ required "origins.app is required" .Values.origins.app | quote }}
            - name: SLASHDOCS_RENDER_ORIGIN
              value: {{ required "origins.render is required" .Values.origins.render | quote }}
            {{- with .Values.origins.previous }}
            - name: SLASHDOCS_PREVIOUS_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            - name: SLASHDOCS_DEPLOYMENT
              value: {{ .Values.deployment.mode | quote }}
            - name: SLASHDOCS_GOOGLE_GROUPS_ENABLED
              value: {{ ternary "true" "false" .Values.googleGroups.enabled | quote }}
            - name: SLASHDOCS_LABELS_ENABLED
              value: {{ ternary "true" "false" .Values.features.labels | quote }}
            {{- if .Values.googleGroups.enabled }}
            - name: GOOGLE_GROUPS_CUSTOMER_ID
              value: {{ required "googleGroups.customerID is required" .Values.googleGroups.customerID | quote }}
            - name: GOOGLE_GROUPS_ADMIN_EMAIL
              value: {{ required "googleGroups.adminEmail is required" .Values.googleGroups.adminEmail | quote }}
            - name: GOOGLE_GROUPS_CREDENTIALS_FILE
              value: /var/run/secrets/slashdocs-google-groups/credentials.json
            - name: GOOGLE_GROUPS_MEMBERSHIP_TTL
              value: {{ .Values.googleGroups.membershipTTL | quote }}
            - name: GOOGLE_GROUPS_REQUEST_TIMEOUT
              value: {{ .Values.googleGroups.requestTimeout | quote }}
            {{- end }}
            {{- if .Values.googleChat.webhookSecret }}
            - name: SLASHDOCS_GOOGLE_CHAT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.googleChat.webhookSecret }}
                  key: {{ .Values.googleChat.webhookKey }}
            {{- end }}
            {{- if eq .Values.deployment.mode "org" }}
            - name: SLASHDOCS_ORG_DOMAINS
              value: {{ required "deployment.orgDomains is required when deployment.mode=org" .Values.deployment.orgDomains | quote }}
            {{- if .Values.deployment.orgName }}
            - name: SLASHDOCS_ORG_NAME
              value: {{ .Values.deployment.orgName | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.deployment.defaultDocPermission }}
            - name: SLASHDOCS_DEFAULT_DOC_PERMISSION
              value: {{ .Values.deployment.defaultDocPermission | quote }}
            {{- end }}
            {{- if .Values.deployment.featured }}
            - name: SLASHDOCS_FEATURED
              value: {{ .Values.deployment.featured | quote }}
            {{- end }}
            {{- if .Values.kvEvents.mode }}
            - name: SLASHDOCS_KV_EVENTS_MODE
              value: {{ .Values.kvEvents.mode | quote }}
            {{- end }}
            - name: SLASHDOCS_MIGRATE
              value: {{ ternary "true" "false" .Values.database.migrate | quote }}
            - name: BLOB_BUCKET
              value: {{ required "blob.bucket is required" .Values.blob.bucket | quote }}
            - name: BLOB_REGION
              value: {{ .Values.blob.region | quote }}
            {{- if .Values.blob.endpoint }}
            - name: BLOB_ENDPOINT
              value: {{ .Values.blob.endpoint | quote }}
            {{- end }}
            - name: BLOB_FORCE_PATH_STYLE
              value: {{ ternary "true" "false" .Values.blob.forcePathStyle | quote }}
            {{- if .Values.allowedOAuthDomains }}
            - name: ALLOWED_OAUTH_DOMAINS
              value: {{ .Values.allowedOAuthDomains | quote }}
            {{- end }}
            {{- if .Values.commitSha }}
            - name: SLASHDOCS_COMMIT_SHA
              value: {{ .Values.commitSha | quote }}
            {{- end }}
            # Component credentials from the secret; DATABASE_URL is composed
            # from them at runtime via $(VAR) expansion (see database.url).
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "slashdocs.secretName" .) .Values.database.existingSecret }}
                  key: {{ .Values.database.hostKey }}
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "slashdocs.secretName" .) .Values.database.existingSecret }}
                  key: {{ .Values.database.userKey }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "slashdocs.secretName" .) .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "slashdocs.secretName" .) .Values.database.existingSecret }}
                  key: {{ .Values.database.nameKey }}
            - name: DATABASE_URL
              # nosemgrep: generic_postgres_string
              value: "postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):{{ .Values.database.port }}/$(DATABASE_NAME)?sslmode={{ .Values.database.sslMode }}"
            {{- if or .Values.kvEvents.existingSecret .Values.kvEvents.listenerDatabaseURL }}
            - name: SLASHDOCS_KV_EVENTS_LISTENER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "slashdocs.secretName" .) .Values.kvEvents.existingSecret }}
                  key: {{ .Values.kvEvents.listenerDatabaseURLKey }}
            {{- end }}
            {{- if .Values.oidc.issuerURL }}
            - name: SLASHDOCS_OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerURL | quote }}
            {{- if .Values.oidc.providerName }}
            - name: SLASHDOCS_OIDC_PROVIDER_NAME
              value: {{ .Values.oidc.providerName | quote }}
            {{- end }}
            {{- if .Values.oidc.internalIssuerURL }}
            - name: SLASHDOCS_OIDC_INTERNAL_ISSUER_URL
              value: {{ .Values.oidc.internalIssuerURL | quote }}
            {{- end }}
            - name: SLASHDOCS_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "slashdocs.secretName" .) .Values.oidc.existingSecret }}
                  key: {{ .Values.oidc.clientIDKey }}
            - name: SLASHDOCS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "slashdocs.secretName" .) .Values.oidc.existingSecret }}
                  key: {{ .Values.oidc.clientSecretKey }}
            {{- else }}
            - name: GOOGLE_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "slashdocs.secretName" .) .Values.googleOAuth.existingSecret }}
                  key: {{ .Values.googleOAuth.clientIDKey }}
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "slashdocs.secretName" .) .Values.googleOAuth.existingSecret }}
                  key: {{ .Values.googleOAuth.clientSecretKey }}
            {{- end }}
            {{- if .Values.githubOAuth.enabled }}
            - name: SLASHDOCS_GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "slashdocs.secretName" .) .Values.githubOAuth.existingSecret }}
                  key: {{ .Values.githubOAuth.clientIDKey }}
            - name: SLASHDOCS_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "slashdocs.secretName" .) .Values.githubOAuth.existingSecret }}
                  key: {{ .Values.githubOAuth.clientSecretKey }}
            {{- end }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "slashdocs.secretName" .) .Values.session.existingSecret }}
                  key: {{ .Values.session.secretKey }}
            {{- if or .Values.blob.existingSecret .Values.blob.accessKeyID }}
            - name: BLOB_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "slashdocs.secretName" .) .Values.blob.existingSecret }}
                  key: {{ .Values.blob.accessKeyIDKey }}
            {{- end }}
            {{- if or .Values.blob.existingSecret .Values.blob.secretAccessKey }}
            - name: BLOB_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "slashdocs.secretName" .) .Values.blob.existingSecret }}
                  key: {{ .Values.blob.secretAccessKeyKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.googleGroups.enabled }}
          volumeMounts:
            - name: google-groups-credentials
              mountPath: /var/run/secrets/slashdocs-google-groups
              readOnly: true
          {{- end }}
      {{- if .Values.googleGroups.enabled }}
      volumes:
        - name: google-groups-credentials
          secret:
            secretName: {{ .Values.googleGroups.existingSecret }}
            items:
              - key: {{ .Values.googleGroups.credentialsKey }}
                path: credentials.json
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
