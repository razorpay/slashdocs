{{- if .Values.ingressRoute.enabled }}
{{- if and .Values.ingressRoute.renderHost (eq .Values.ingressRoute.renderHost .Values.ingressRoute.host) }}
{{- fail "ingressRoute.renderHost must differ from ingressRoute.host: untrusted document HTML must be rendered on a separate origin from the authenticated app" }}
{{- end }}
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "slashdocs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "slashdocs.labels" . | nindent 4 }}
  {{- with .Values.ingressRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
    {{- toYaml .Values.ingressRoute.entryPoints | nindent 4 }}
  routes:
    - kind: Rule
      match: Host(`{{ required "ingressRoute.host is required" .Values.ingressRoute.host }}`)
      services:
        - name: {{ include "slashdocs.fullname" . }}
          port: {{ .Values.service.port }}
    # Untrusted uploaded HTML is sandbox-rendered on a separate origin.
    - kind: Rule
      match: Host(`{{ required "ingressRoute.renderHost is required (a separate origin for sandbox-rendered document HTML)" .Values.ingressRoute.renderHost }}`)
      services:
        - name: {{ include "slashdocs.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
