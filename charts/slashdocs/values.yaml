# slashdocs Helm values

replicaCount: 1

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

image:
  repository: razorpay/slashdocs
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""
  imagePullSecrets: []

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

metrics:
  port: 9090
  service:
    enabled: true

# Deployment mode. `public` (the default) allows any account accepted by the
# configured OIDC provider (optionally gated by allowedOAuthDomains); `org`
# gates login to deployment.orgDomains and labels "everyone" sharing as the
# org. To restrict the install to your company domain, switch to org mode:
#
#   deployment:
#     mode: org
#     orgDomains: "acme.com"        # comma-separated; required when mode=org
#     orgName: "Acme"               # share UI copy, e.g. "Anyone in Acme"
deployment:
  mode: public
  # Comma-separated org domains. Required when mode=org; also the login gate.
  orgDomains: ""
  # Org display name used in share UI copy (e.g. "Anyone in Acme").
  orgName: ""
  # Sharing default the server applies to every created document:
  # viewer | commenter | editor | private. Empty means private. Non-private
  # values require mode=org (a public server would share with anyone holding
  # the link); the server refuses to start otherwise, so a misconfiguration
  # fails at rollout. Clients can override per document with the
  # default_permission field and revoke the reported default grant.
  defaultDocPermission: ""
  # JSON object of sections that the Documents page shows to every user. Keep
  # it a string: the key order is the section order, and Helm's toJson would
  # sort the keys. See docs/self-hosting.md ("Featured sections").
  #   featured: |
  #     {"Dev tutorials": {"permanent": true, "items": ["fld_abc"]}}
  featured: ""

# Feature rollout switches. Labels are temporarily disabled by default; set
# labels to true to re-enable them.
features:
  labels: false

# Kubernetes Deployment rollout strategy. Keep RollingUpdate normally. The
# structured-mentions upgrade documented in docs/self-hosting.md requires one
# Recreate rollout so old and new comment writers never overlap.
updateStrategy:
  type: RollingUpdate

# Public origins. `app` and `render` MUST be different hosts in production:
# the render origin serves untrusted uploaded HTML in a sandboxed frame, and
# a separate host keeps that content outside the authenticated app origin's
# cookie and same-origin boundary.
origins:
  app: https://slashdocs.example.com
  render: https://render.slashdocs.example.com
  # Comma-separated app origins that this deployment used before. The server
  # redirects them to `app`. Route these hosts to the Service too.
  previous: ""

# Sign-in. Configure exactly one of `googleOAuth` and `oidc` (setting
# oidc.issuerURL switches the chart to the generic OIDC variables).

# Google OAuth web client. Configure the callback URL in Google Cloud as:
#   https://slashdocs.example.com/v1/auth/google/callback
googleOAuth:
  clientID: ""
  clientSecret: ""
  existingSecret: ""
  clientIDKey: GOOGLE_OAUTH_CLIENT_ID
  clientSecretKey: GOOGLE_OAUTH_CLIENT_SECRET

# Optional GitHub OAuth App used by window.slashdocs.github in rendered documents.
# Register https://slashdocs.example.com/v1/integrations/github/callback.
githubOAuth:
  enabled: false
  clientID: ""
  clientSecret: ""
  existingSecret: ""
  clientIDKey: SLASHDOCS_GITHUB_CLIENT_ID
  clientSecretKey: SLASHDOCS_GITHUB_CLIENT_SECRET

# Optional Google Workspace group sharing. Requires deployment.mode=org and
# a Secret containing delegated service-account credentials.
googleGroups:
  enabled: false
  customerID: ""
  adminEmail: ""
  existingSecret: ""
  credentialsKey: credentials.json
  membershipTTL: 1m
  requestTimeout: 5s

# Google Chat comment notifications (docs/comment-notifications.md): Secret
# holding a space's incoming webhook URL. Do not also set
# SLASHDOCS_SLACK_BOT_TOKEN via extraEnv.
googleChat:
  webhookSecret: ""
  webhookKey: webhook-url

# Generic OpenID Connect provider (Okta, Entra ID, Keycloak, Dex, ...).
# Register the redirect URI with the provider as:
#   https://slashdocs.example.com/v1/auth/oidc/callback
oidc:
  issuerURL: ""
  # Display label for the login button ("Continue with <name>"); the server
  # defaults it to "SSO".
  providerName: ""
  # Base URL where the server reaches the IdP when that differs from the
  # browser-facing issuer (split horizon). Usually empty.
  internalIssuerURL: ""
  clientID: ""
  clientSecret: ""
  existingSecret: ""
  clientIDKey: SLASHDOCS_OIDC_CLIENT_ID
  clientSecretKey: SLASHDOCS_OIDC_CLIENT_SECRET

# Session secret must be at least 32 bytes.
session:
  secret: ""
  existingSecret: ""
  secretKey: SESSION_SECRET

# Postgres connection. The component values are read from the secret into
# env vars, then `url` is composed from them at runtime via Kubernetes
# $(VAR) env expansion
database:
  existingSecret: ""
  host: ""
  user: ""
  password: ""
  name: ""
  hostKey: DATABASE_HOST
  userKey: DATABASE_USER
  passwordKey: DATABASE_PASSWORD
  nameKey: DATABASE_NAME
  port: 5432
  sslMode: require
  migrate: true

# S3-compatible blob storage for immutable HTML versions.
blob:
  bucket: ""
  region: us-east-1
  endpoint: ""
  forcePathStyle: false
  accessKeyID: ""
  secretAccessKey: ""
  existingSecret: ""
  accessKeyIDKey: blob-access-key-id
  secretAccessKeyKey: blob-secret-access-key

# Optional comma-separated email-domain allowlist applied after OIDC login
# (e.g. "acme.com"). Leave empty to accept any account the provider allows.
allowedOAuthDomains: ""

# Realtime document KV event delivery (see docs/self-hosting.md, "Optional"
# env vars). Both values render env vars only when set.
kvEvents:
  # SLASHDOCS_KV_EVENTS_MODE: "auto", "notify", or "poll". Empty uses the server
  # default (auto). Use "poll" when the only database route is a
  # transaction-pooling endpoint (e.g. PgBouncer transaction mode).
  mode: ""
  # SLASHDOCS_KV_EVENTS_LISTENER_DATABASE_URL: direct or session-pooled URL to
  # the same database for the dedicated LISTEN connection. Never a
  # transaction-pooling endpoint. Contains credentials, so it is stored in the
  # chart-managed Secret; or reference a pre-created Secret instead via
  # existingSecret + listenerDatabaseURLKey.
  listenerDatabaseURL: ""
  existingSecret: ""
  listenerDatabaseURLKey: SLASHDOCS_KV_EVENTS_LISTENER_DATABASE_URL

# Optional runtime revision surfaced at /commit.txt.
commitSha: ""

extraEnv: []
# - name: FOO
#   value: bar

extraEnvFrom: []
# - secretRef:
#     name: slashdocs-extra

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: slashdocs.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: slashdocs-tls
  #   hosts:
  #     - slashdocs.example.com

# Traefik IngressRoute (used by clusters that run Traefik CRDs instead of
# native Ingress). Routes the app host (and optionally a separate render host)
# to the app port; the metrics port is never routed here.
ingressRoute:
  enabled: false
  host: ""
  # Separate host for sandbox-rendered HTML. Required when the IngressRoute is
  # enabled, and it must differ from `host`: rendering untrusted document HTML
  # on the app origin would let uploaded scripts run same-origin with the
  # authenticated application. Template rendering fails if this is empty or
  # equal to `host`.
  renderHost: ""
  entryPoints:
    - http
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  enabled: false
  minAvailable: 1
