# Local dev/eval stack: aidocs + Postgres + MinIO + Dex.
#
#   docker compose up --build
#   open http://localhost:8080 and sign in as admin@example.com / password
#
# Dex is the DEV identity provider only; real deployments configure Google or
# any OIDC provider per docs/self-hosting.md. `make e2e` runs the full smoke
# test against this stack.
#
# The app is served on http://localhost:8080 and documents render on
# http://127.0.0.1:8080 — same listener, but a different browser origin, which
# is how aidocs keeps untrusted document HTML away from your session.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aidocs
      POSTGRES_PASSWORD: aidocs
      POSTGRES_DB: aidocs
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidocs -d aidocs"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: c.rzp.io/razorpay-external/minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot sidecar that creates the document bucket, then exits.
  minio-init:
    image: c.rzp.io/razorpay-external/minio/minio:RELEASE.2024-12-18T13-15-44Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/aidocs-documents

  dex:
    image: dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dev/dex-config.yaml:/etc/dex/config.yaml:ro
    ports:
      # Browsers are redirected to Dex during login, so it must be reachable
      # from the host too (AIDOCS_OIDC_ISSUER_URL below).
      - "5556:5556"
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5556/dex/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  aidocs:
    build: .
    # CI prebuilds this image once with a shared layer cache and injects the
    # tag; local runs fall back to an ordinary compose build.
    image: ${AIDOCS_IMAGE:-aidocs-e2e:local}
    ports:
      - "8080:8080"
    environment:
      # nosemgrep: generic_postgres_string
      DATABASE_URL: postgres://aidocs:aidocs@postgres:5432/aidocs?sslmode=disable
      AIDOCS_MIGRATE: "true"
      # The compose stack uses direct Postgres, so exercise LISTEN/NOTIFY rather
      # than allowing the E2E harness to pass through the polling fallback.
      AIDOCS_KV_EVENTS_MODE: notify

      BLOB_BUCKET: aidocs-documents
      BLOB_ENDPOINT: http://minio:9000
      BLOB_FORCE_PATH_STYLE: "true"
      BLOB_ACCESS_KEY_ID: minioadmin
      BLOB_SECRET_ACCESS_KEY: minioadmin
      BLOB_REGION: us-east-1

      # Optional: supplied by the local process environment for Slack testing.
      AIDOCS_SLACK_BOT_TOKEN: ${AIDOCS_SLACK_BOT_TOKEN:-}

      AIDOCS_APP_ORIGIN: http://localhost:8080
      # Distinct browser origin, same listener: the server only serves /v/…
      # renders when the request's Host matches this origin.
      AIDOCS_RENDER_ORIGIN: http://127.0.0.1:8080

      # Split horizon: browsers reach Dex on localhost:5556, the server
      # reaches it on the compose network at dex:5556.
      AIDOCS_OIDC_ISSUER_URL: http://localhost:5556/dex
      AIDOCS_OIDC_INTERNAL_ISSUER_URL: http://dex:5556/dex
      AIDOCS_OIDC_CLIENT_ID: aidocs
      AIDOCS_OIDC_CLIENT_SECRET: aidocs-dev-secret
      AIDOCS_OIDC_PROVIDER_NAME: Dex

      # Optional per-user GitHub OAuth App credentials. Export these before
      # running Compose to exercise GitHub-backed documents locally.
      AIDOCS_GITHUB_CLIENT_ID: ${AIDOCS_GITHUB_CLIENT_ID:-}
      AIDOCS_GITHUB_CLIENT_SECRET: ${AIDOCS_GITHUB_CLIENT_SECRET:-}

      # Dev-only value; generate your own for anything beyond localhost.
      SESSION_SECRET: dev-only-session-secret-0123456789abcdef
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      dex:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  postgres-data:
  minio-data:
